packages:
  - "apps/*"
  - "packages/*"
  - "cli"

allowBuilds:
  esbuild: true
  msw: false

patchedDependencies:
  miniflare@5.20261012.0-beta: patches/miniflare@5.20261012.0-beta.patch

overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  vite@*: "catalog:"
  vitest@*: "catalog:"
  "@vitest/browser": 5.0.5
  "@vitest/browser-preview": 5.0.5
  "@vitest/mocker": 5.0.5
  "@vitest/pretty-format": 5.0.5
  "@vitest/snapshot": 5.0.5
  "@vitest/spy": 5.0.5
  "@vitest/utils": 5.0.5
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.4.0
  vitest: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
