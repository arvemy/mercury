name: Feature request
description: Suggest a change to the Mercury template or to create-mercury.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you'd like. Mercury is opinionated and has no options, so say why it fits every project.
    validations:
      required: true
