name: create-mercury

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config --global user.name "create-mercury smoke"
          git config --global user.email "smoke@create-mercury.invalid"
      - run: cli/scripts/smoke.sh

  smoke-result:
    name: smoke
    if: ${{ always() }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - run: test "$SMOKE_RESULT" = success
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}

  next-steps:
    name: next-steps
    needs: smoke
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config --global user.name "create-mercury smoke"
          git config --global user.email "smoke@create-mercury.invalid"
      - run: cli/scripts/next-steps.sh
