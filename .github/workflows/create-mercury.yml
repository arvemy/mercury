name: create-mercury

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config --global user.name "create-mercury smoke"
          git config --global user.email "smoke@create-mercury.invalid"
      - run: cli/scripts/smoke.sh

  compose-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the template's database
        run: docker compose up -d --wait db
      - name: Write a row
        run: |
          docker compose exec -T db psql -U postgres -d app -tAc "show server_version" | grep -E '^18\.'
          docker compose exec -T db psql -U postgres -d app -c "create table persist_check (id int); insert into persist_check values (1)"
      - name: Recreate the container and read the row back
        run: |
          docker compose down
          docker compose up -d --wait db
          test "$(docker compose exec -T db psql -U postgres -d app -tAc 'select count(*) from persist_check')" = 1
      - if: always()
        run: docker compose down -v

  next-steps:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config --global user.name "create-mercury smoke"
          git config --global user.email "smoke@create-mercury.invalid"
      - run: cli/scripts/next-steps.sh
