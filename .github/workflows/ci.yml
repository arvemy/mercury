name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t mercury-api .
      - name: Start PostgreSQL
        run: |
          docker network create mercury
          docker run -d --name db --network mercury -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:18-alpine
          until docker exec db pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
      - name: Run migrations twice
        run: |
          for _ in 1 2; do
            docker run --rm --network mercury -e DATABASE_URL mercury-api node dist/migrate.js
          done
      - name: Run the API
        run: |
          docker run -d --name api --network mercury -p 3000:3000 -e DATABASE_URL mercury-api
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy
          test "$(docker exec api id -u)" != 0
          test "$(curl -fsS localhost:3000/api/health)" = '{"status":"ok"}'
          test "$(curl -fsS localhost:3000/api/todos)" = '[]'
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t mercury-web .
      - name: Run the web app
        run: |
          docker run -d --name web --network mercury -p 8080:8080 mercury-web
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy
          test "$(docker exec web id -u)" != 0
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/todos | grep -q '<div id="root">'
          asset=$(curl -fsS localhost:8080/ | grep -o '/assets/index-[^"]*\.js')
          curl -fsSI "localhost:8080$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/assets/missing.js)" = 404
          test "$(curl -fsS localhost:8080/api/health)" = '{"status":"ok"}'
      - if: failure()
        run: |
          docker logs api || true
          docker logs web || true
