name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:worker

  ci:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success

  integration:
    name: real Neon Auth and database integration
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.RUN_LIVE_INTEGRATION == 'true')
    needs: checks
    runs-on: ubuntu-latest
    environment: integration
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - name: Sanitize integration evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { sanitizeIntegrationEvidence } from './scripts/integration.mjs';
          import path from 'node:path';
          await sanitizeIntegrationEvidence({ outputDir: path.join(process.env.RUNNER_TEMP, 'integration-evidence') });
          NODE
      - name: Keep integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-evidence
          path: ${{ runner.temp }}/integration-evidence
          if-no-files-found: warn
